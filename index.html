<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>membr. — Support</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#F4F4F4;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    header{display:flex;align-items:center;justify-content:space-between;padding:28px 48px;border-bottom:1px solid rgba(255,255,255,0.08)}
    .logo{font-family:'DM Serif Display',serif;font-size:28px;letter-spacing:-0.02em;color:#F4F4F4;text-decoration:none}
    .logo span{color:#E03030}
    .label{font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#666}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px}
    h1{font-family:'DM Serif Display',serif;font-size:clamp(56px,10vw,96px);letter-spacing:-0.02em;color:#F4F4F4;margin-bottom:16px}
    h1 span{color:#E03030}
    .tag{font-size:15px;color:#666;margin-bottom:64px}
    .card{background:#0F0F0F;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:40px 44px;max-width:460px;width:100%}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#666;margin-bottom:14px}
    h2{font-family:'DM Serif Display',serif;font-size:26px;color:#F4F4F4;margin-bottom:12px}
    p{font-size:15px;line-height:1.65;color:#666;margin-bottom:28px}
    a.email{display:flex;align-items:center;gap:10px;background:#1A1A1A;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:14px 20px;text-decoration:none;color:#F4F4F4;font-size:14px;font-weight:500}
    .dot{width:8px;height:8px;border-radius:50%;background:#E03030;flex-shrink:0}
    footer{text-align:center;padding:28px 24px;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:#666}
    footer span{color:#E03030}
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo">membr<span>.</span></a>
    <span class="label">Support</span>
  </header>
  <main>
    <h1>membr<span>.</span></h1>
    <p class="tag">Remember everyone. Miss no one.</p>
    <div class="card">
      <p class="eyebrow">Get in touch</p>
      <h2>Need help?</h2>
      <p>Questions, feedback, or anything at all — send us an email and we'll get back to you.</p>
      <a class="email" href="mailto:adamcofsky@gmail.com">
        <span class="dot"></span>
        adamcofsky@gmail.com
      </a>
    </div>
  </main>
  <footer><p>© 2026 membr<span>.</span> · Remember everyone. Miss no one.</p></footer>
</body>
