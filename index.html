<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>membr. — Support</title>
  <meta name="description" content="Support for membr. — Remember everyone. Miss no one." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000000;
      --fg: #F4F4F4;
      --muted: #666666;
      --surface1: #0F0F0F;
      --surface2: #1A1A1A;
      --border: rgba(255,255,255,0.08);
      --red: #E03030;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 30% at 50% -5%, rgba(224,48,48,0.06), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      border-bottom: 1px solid var(--border);
    }
    .wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--fg);
      text-decoration: none;
    }
    .wordmark span { color: var(--red); }
    .header-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
    }
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
    }
    .hero-wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(56px, 10vw, 96px);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.5s ease-out 0.1s forwards;
    }
    .hero-wordmark span { color: var(--red); }
    .tagline {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 64px;
      letter-spacing: 0.03em;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.25s forwards;
    }
    .card {
      background: var(--surface1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 44px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7), 0 0 0 1px rgba(224,48,48,0.08);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.5s ease-out 0.4s forwards;
    }
    .card-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--fg);
      margin-bottom: 12px;
    }
    .card p {
      font-size: 15px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .email-link {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      text-decoration: none;
      color: var(--fg);
      font-size: 14px;
      font-weight: 500;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }
    .email-link:hover {
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px 24px 32px;
      border-top: 1px solid var(--border);
    }
    footer p { font-size: 12px; color: var(--muted); }
    footer p span { color: var(--red); }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      header { padding: 20px 24px; }
      .card { padding: 28px 24px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="wordmark">membr<span>.</span></a>
    <span class="header-label">Support</span>
  </header>
  <main>
    <div class="hero-wordmark">membr<span>.</span></div>
    <p class="tagline">Remember everyone. Miss no one.</p>
    <div class="card">
      <p class="card-eyebrow">Get in touch</p>
      <h2>Need help?</h2>
      <p>Questions, feedback, or anything at all — send us an email and we'll get back to you.</p>
      <a class="email-link" href="mailto:adamcofsky@gmail.com">
        <span class="dot"></span>
        adamcofsky@gmail.com
      </a>
    </div>
  </main>
  <footer>
    <p>© 2026 membr<span>.</span> &nbsp;·&nbsp; Remember everyone. Miss no one.</p>
  </footer>
</body>
</html>
